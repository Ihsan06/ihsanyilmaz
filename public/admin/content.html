<!DOCTYPE html>
<html lang="de" class="admin">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content erstellen | AIY | Ihsan Yilmaz</title>
  <link rel="icon" type="image/svg+xml" href="/admin/icon.svg" />
  <link rel="stylesheet" href="/css/fonts.css?v=3" />
  <link rel="stylesheet" href="/css/style.css?v=229" />
  <link rel="stylesheet" href="/css/admin.css?v=307" />
  <script>
    /* Muss im Kopf stehen, nicht in gemeinsam.js: das laeuft erst am Ende
       der Seite, und bis dahin waere die Leiste offen gezeichnet. */
    try { if (localStorage.getItem('adm-leiste') === 'zu') document.documentElement.classList.add('leiste-zu'); } catch (e) {}
  </script>
</head>
<body class="admin">

  <header class="admin-kopf" id="admin-kopf"></header>

  <main class="admin-inhalt">
    <div class="container">
      <div class="admin-titel">
        <p class="admin-eyebrow">Instagram</p>
        <h1>Content erstellen</h1>
        <p class="lead">Beiträge und Stories – aus den eigenen Fotos der Galerie gebaut und verschickt.</p>
      </div>

      <section class="admin-karte mon-block">
        <div class="ueb-kopf">
          <h2 class="ig-titel">
            <svg class="ig-zeichen" viewBox="0 0 24 24" width="19" height="19" fill="none"
                 stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M12 4v16M4 12h16" stroke-linecap="round"/>
            </svg>
            Neuer Content</h2>
          <nav class="mf-reiter sm-reiter" role="tablist" aria-label="Was entsteht">
            <button type="button" role="tab" data-art="beitrag" aria-selected="true">Beiträge</button>
            <button type="button" role="tab" data-art="story" aria-selected="false">Stories</button>
          </nav>
          <a class="sm-entwurf-link" href="/admin/entwuerfe" title="Gespeicherte Entwürfe">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 4.5A1.5 1.5 0 0 1 6.5 3h8.8L19 6.7v12.8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5z"/>
              <path d="M8.5 3v4.5h6V3M8.5 21v-6.5h7V21"/>
            </svg>
            Entwürfe <b id="sm-entwurf-zahl" hidden></b></a>
        </div>

        <!-- Steht nur da, wenn gerade ein gespeicherter Entwurf offen ist. -->
        <div class="sm-entwurf-lage" id="sm-entwurf-lage" role="status" hidden></div>

        <!-- Zwei Reiter, eine Quelle: Beitraege wie Stories entstehen aus den
             eigenen Fotos der Galerie – die Quelle steht fest und muss nicht
             gewaehlt werden. Reels sind raus: ohne bewegtes Material ist ein
             Reel eine Diashow. -->

        <div id="gd-liste" aria-live="polite"><p class="mon-laedt">Wird geladen …</p></div>
        <div id="gd-aufraeumen" aria-live="polite"></div>
      </section>

    </div>
  </main>

  <script src="/admin/marke.js?v=2"></script>
  <script src="/admin/gemeinsam.js?v=36"></script>
  <script src="/admin/beitrag-text.js?v=25"></script>
  <script src="/admin/beitrag-stil.js?v=14"></script>
  <script src="/admin/beitrag-schau.js?v=17"></script>
  <script src="/admin/social-media.js?v=230"></script>
</body>
</html>
